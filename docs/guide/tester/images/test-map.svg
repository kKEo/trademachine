<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t">
  <title id="t">Product areas coloured by test coverage</title>
  <rect x="0" y="0" width="900" height="330" rx="12" fill="#f7f8fa"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">
    <!-- legend -->
    <rect x="20" y="20" width="14" height="14" rx="3" fill="#d1fae5" stroke="#047857"/><text x="42" y="32" text-anchor="start">covered directly</text>
    <rect x="190" y="20" width="14" height="14" rx="3" fill="#fef3c7" stroke="#b45309"/><text x="212" y="32" text-anchor="start">covered through fakes or helpers</text>
    <rect x="460" y="20" width="14" height="14" rx="3" fill="#fee2e2" stroke="#b91c1c"/><text x="482" y="32" text-anchor="start">no automated test</text>

    <!-- row 1 -->
    <rect x="20" y="60" width="200" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="120" y="86" font-weight="600">Engine loop</text><text x="120" y="104" fill="#5b6472" font-size="12">test_engine*.py</text>
    <rect x="240" y="60" width="200" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="340" y="86" font-weight="600">Bar aggregator</text><text x="340" y="104" fill="#5b6472" font-size="12">test_bars.py</text>
    <rect x="460" y="60" width="200" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="560" y="86" font-weight="600">Risk rules</text><text x="560" y="104" fill="#5b6472" font-size="12">test_risk.py</text>
    <rect x="680" y="60" width="200" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="780" y="86" font-weight="600">Paper broker, replay</text><text x="780" y="104" fill="#5b6472" font-size="12">test_paper_broker.py</text>

    <!-- row 2 -->
    <rect x="20" y="140" width="200" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="120" y="166" font-weight="600">Strategies</text><text x="120" y="184" fill="#5b6472" font-size="12">test_strategies.py</text>
    <rect x="240" y="140" width="200" height="60" rx="8" fill="#d1fae5" stroke="#047857"/>
    <text x="340" y="166" font-weight="600">Config, CLI guard</text><text x="340" y="184" fill="#5b6472" font-size="12">test_config.py, test_cli.py</text>
    <rect x="460" y="140" width="200" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="560" y="166" font-weight="600">Alpaca mapping</text><text x="560" y="184" fill="#5b6472" font-size="12">test_alpaca_mapping.py</text>
    <rect x="680" y="140" width="200" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="780" y="166" font-weight="600">XTB broker, decoding</text><text x="780" y="184" fill="#5b6472" font-size="12">test_xtb_broker.py (FakeSession)</text>

    <!-- row 3 -->
    <rect x="20" y="220" width="200" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="120" y="246" font-weight="600">Live connectivity</text><text x="120" y="264" fill="#5b6472" font-size="12">Alpaca stream, XTB session</text>
    <rect x="240" y="220" width="200" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="340" y="246" font-weight="600">Reconnect</text><text x="340" y="264" fill="#5b6472" font-size="12">not implemented either</text>
    <rect x="460" y="220" width="200" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="560" y="246" font-weight="600">Kill switch end to end</text><text x="560" y="264" fill="#5b6472" font-size="12">no CLI trigger exists</text>
    <rect x="680" y="220" width="200" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="780" y="246" font-weight="600">Multi-strategy runs</text><text x="780" y="264" fill="#5b6472" font-size="12">shared aggregator</text>
    <text x="450" y="312" fill="#5b6472" font-size="12">Nothing in the suite touches the network. Live behaviour is checked by hand (Exploratory testing).</text>
  </g>
</svg>
