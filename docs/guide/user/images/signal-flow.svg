<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-labelledby="t">
  <title id="t">How a price becomes a signal and, optionally, an order</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="180" rx="12" fill="#f7f8fa"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">
    <rect x="20" y="50" width="170" height="80" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="105" y="84" font-weight="600">Prices</text>
    <text x="105" y="104" fill="#5b6472">from Alpaca or XTB</text>

    <rect x="235" y="50" width="170" height="80" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="320" y="84" font-weight="600">Bars</text>
    <text x="320" y="104" fill="#5b6472">1 min, 5 min, 1 h ...</text>

    <rect x="450" y="50" width="170" height="80" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="535" y="84" font-weight="600">Strategy</text>
    <text x="535" y="104" fill="#5b6472">says LONG or FLAT</text>

    <rect x="665" y="20" width="195" height="60" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="762" y="46" font-weight="600">Printed as a SIGNAL line</text>
    <text x="762" y="66" fill="#5b6472">always</text>

    <rect x="665" y="100" width="195" height="60" rx="10" fill="#fff4e5" stroke="#b45309"/>
    <text x="762" y="126" font-weight="600">Order to your paper account</text>
    <text x="762" y="146" fill="#92400e">only with --execute</text>

    <line x1="190" y1="90" x2="233" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="405" y1="90" x2="448" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="620" y1="80" x2="663" y2="55" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="620" y1="100" x2="663" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
