<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t">
  <title id="t">Layered architecture of tradesignals</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" rx="12" fill="#f7f8fa"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1f2937">
    <!-- CLI -->
    <rect x="300" y="20" width="300" height="52" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="450" y="42" text-anchor="middle" font-weight="600">cli.py</text>
    <text x="450" y="60" text-anchor="middle" fill="#5b6472">flags, .env, logging, live guard, signals</text>

    <!-- Engine -->
    <rect x="60" y="110" width="780" height="110" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="80" y="132" font-weight="600">engine.py: SignalEngine</text>
    <rect x="80" y="150" width="170" height="50" rx="8" fill="#ffffff" stroke="#9aa4b2"/>
    <text x="165" y="171" text-anchor="middle">bars.py</text>
    <text x="165" y="189" text-anchor="middle" fill="#5b6472" font-size="12">BarAggregator per (symbol, tf)</text>
    <rect x="270" y="150" width="170" height="50" rx="8" fill="#ffffff" stroke="#9aa4b2"/>
    <text x="355" y="171" text-anchor="middle">strategies/</text>
    <text x="355" y="189" text-anchor="middle" fill="#5b6472" font-size="12">pure: on_bar(bar) -> Signal</text>
    <rect x="460" y="150" width="170" height="50" rx="8" fill="#ffffff" stroke="#9aa4b2"/>
    <text x="545" y="171" text-anchor="middle">risk.py</text>
    <text x="545" y="189" text-anchor="middle" fill="#5b6472" font-size="12">RiskManager.check()</text>
    <rect x="650" y="150" width="170" height="50" rx="8" fill="#ffffff" stroke="#9aa4b2"/>
    <text x="735" y="171" text-anchor="middle">models.py</text>
    <text x="735" y="189" text-anchor="middle" fill="#5b6472" font-size="12">Tick Bar Signal Order Position</text>

    <!-- Interfaces -->
    <rect x="60" y="250" width="780" height="52" rx="10" fill="#fff4e5" stroke="#b45309"/>
    <text x="80" y="272" font-weight="600" fill="#92400e">interfaces.py</text>
    <text x="450" y="272" text-anchor="middle">MarketDataProvider (connect, subscribe, stream, get_bars)</text>
    <text x="450" y="291" text-anchor="middle">Broker (submit_order, cancel_all, get_positions, get_account, order_updates) and SymbolMapper</text>

    <!-- Adapters -->
    <rect x="60" y="332" width="240" height="66" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="180" y="356" text-anchor="middle" font-weight="600">providers/alpaca.py</text>
    <text x="180" y="376" text-anchor="middle" fill="#5b6472" font-size="12">alpaca-py: quotes + 1m bars, paper/live</text>
    <rect x="330" y="332" width="240" height="66" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="450" y="356" text-anchor="middle" font-weight="600">providers/xtb.py</text>
    <text x="450" y="376" text-anchor="middle" fill="#5b6472" font-size="12">raw xAPI websockets: ticks, demo/real</text>
    <rect x="600" y="332" width="240" height="66" rx="10" fill="#eef2f7" stroke="#6b7280"/>
    <text x="720" y="356" text-anchor="middle" font-weight="600">providers/fake.py</text>
    <text x="720" y="376" text-anchor="middle" fill="#5b6472" font-size="12">ReplayProvider + PaperBroker (tests, --broker paper)</text>

    <line x1="450" y1="72" x2="450" y2="108" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="220" x2="450" y2="248" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="180" y1="302" x2="180" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="302" x2="450" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="720" y1="302" x2="720" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
