[project]
name = "tradesignals"
version = "0.1.0"
description = "Provider-agnostic trade signal engine (Alpaca, XTB)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
tradesignals = "tradesignals.cli:main"

[tool.setuptools.packages.find]
include = ["tradesignals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "BLE"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
