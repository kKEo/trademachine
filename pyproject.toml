[project]
name = "tradesignals"
version = "0.1.0"
description = "Provider-agnostic trade signal engine (Alpaca, XTB)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
console = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
tui = ["textual>=0.60", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
tradesignals = "tradesignals.cli:main"
tradesignals-tui = "tradesignals.tui:main"

[tool.setuptools.packages.find]
include = ["tradesignals*"]

[tool.setuptools.package-data]
"tradesignals.console" = ["templates/*.html", "templates/partials/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "BLE"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
