[project]
name = "tradesignals"
version = "0.1.0"
description = "Provider-agnostic trade signal engine (Alpaca, XTB)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tradesignals = "tradesignals.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
